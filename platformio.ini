[platformio]
core_dir = .platformio

[env]
framework = arduino
monitor_speed = 115200

[env:lolin_d32_pro]
platform = https://api.github.com/repos/pioarduino/platform-espressif32/tarball/55.03.311 ; 55.03.311
board = lolin_d32_pro

[env:esp32-c6-devkitm-1]
platform = https://api.github.com/repos/pioarduino/platform-espressif32/tarball/55.03.311 ; 55.03.311
board = esp32-c6-devkitm-1

[env:nodemcu]
platform = platformio/espressif8266 @ 4.2.1
board = nodemcu
